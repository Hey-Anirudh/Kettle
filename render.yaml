# Render Blueprint — deploy the Kettle backend + a free Postgres database.
# In Render: New > Blueprint > connect this repo. The dashboard asks you to
# paste the two "sync: false" secrets (Spotify + Google) — nothing else to set.
# SECRET_KEY is auto-generated; DATABASE_URL is wired to the Postgres instance.
services:
  - type: web
    name: kettle-backend
    env: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kettle-db
          property: connectionString
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: kettle-db
    plan: free
